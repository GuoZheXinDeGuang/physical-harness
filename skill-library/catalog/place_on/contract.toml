[skill]
name = "place_on"
description = "Place one held object stably on top of a named support object."
kind = "segment"
requires = ["robot is securely holding object", "target is a stable support"]
ensures = ["object is released and supported by target"]
exit_conditions = ["backend on-top predicate is true and the gripper has released"]

[arguments]
object = "str"
target = "str"
