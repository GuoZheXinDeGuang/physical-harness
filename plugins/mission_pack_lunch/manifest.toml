# The pack_lunch PERSISTENT-EPISODE mission card (M7 on RoboCasa). Dropping this
# dir makes {"kind":"task","task":"pack_lunch"} an accepted brief. NO [mounts.*]
# (base_profile sha untouched); pure data + a deterministic planner over the
# base's persistent-episode runner -- the kitchen_thaw pattern, per-item loop
# with a temperature->container decide node.
#
# needs_sim: the ONE episode is a real robocasa PackFoodByTemp world (2 hot + 2
# cold items, three far-apart fixtures) the sixteen segment nodes drive. No
# sibling import (all refs via load_provider -- tests/test_boundaries.py).
needs_sim = true

[task_bindings.pack_lunch]
# actuation floor for {"kind":"task"} briefs that omit max_actuations: the
# graph's node count plus replan/recovery headroom (the task default of 3 dies at node 3)
max_actuations = 40
env = "plugins.embodiment_robocasa:provider"
percept = "plugins.embodiment_robocasa.percept:provider"
policy = "plugins.embodiment_robocasa.lunch_driver:provider"
planner = "plugins.mission_pack_lunch.planner:provider"
catalogue = "plugins.mission_pack_lunch.planner:CATALOGUE"
records = "plugins.mission_pack_lunch.planner:SKILL_RECORDS"
# the record names this card's planner selects (== SKILL_RECORDS keys; a
# base-lane test pins them) -- the vault's USES edges read this line as data
skills = [
    "carry_cold0", "carry_cold1", "carry_hot0", "carry_hot1", "grasp_cold0",
    "grasp_cold1", "grasp_hot0", "grasp_hot1", "nav_cold0", "nav_cold1", "nav_hot0",
    "nav_hot1", "pack_cold0", "pack_cold1", "pack_hot0", "pack_hot1", "report",
    "sort_temp", "survey", "v_at_cold0", "v_at_cold1", "v_at_hot0", "v_at_hot1",
    "v_grasped_cold0", "v_grasped_cold1", "v_grasped_hot0", "v_grasped_hot1",
    "v_packed_cold0", "v_packed_cold1", "v_packed_hot0", "v_packed_hot1"
]
initial_facts = "plugins.mission_pack_lunch.planner:INITIAL_FACTS"
oracles = "plugins.mission_pack_lunch.planner:ORACLES"
predicates = "plugins.mission_pack_lunch.planner:PREDICATES"
episodic = true
episode = "plugins.mission_pack_lunch.planner:EPISODE"
segment_specs = "plugins.mission_pack_lunch.planner:SEGMENT_SPECS"
