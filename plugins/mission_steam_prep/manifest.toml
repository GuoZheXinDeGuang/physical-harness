# The steam_prep PERSISTENT-EPISODE mission card (M7 on RoboCasa). Dropping this
# dir makes {"kind":"task","task":"steam_prep"} an accepted brief. NO [mounts.*]
# (base_profile sha untouched); pure data + a deterministic planner over the
# base's persistent-episode runner.
#
# GRAPH-FIRST card: the 21-node five-phase graph + predicates are complete; the
# faucet segments run an honest stub (no sink-handle driver exists yet -- the
# hinge-arc actuation gap), so the mission's E2E frontier is the water-on verify,
# xfail-marked "awaiting sink driver" in tests/test_robocasa_missions.py. The
# graph enters the vault/UI now; the capability lands later, the card unchanged.
needs_sim = true

[task_bindings.steam_prep]
# actuation floor for {"kind":"task"} briefs that omit max_actuations: the
# graph's node count plus replan/recovery headroom (the task default of 3 dies at node 3)
max_actuations = 28
env = "plugins.embodiment_robocasa:provider"
percept = "plugins.embodiment_robocasa.percept:provider"
policy = "plugins.embodiment_robocasa.steam_driver:provider"
planner = "plugins.mission_steam_prep.planner:provider"
catalogue = "plugins.mission_steam_prep.planner:CATALOGUE"
records = "plugins.mission_steam_prep.planner:SKILL_RECORDS"
# the record names this card's planner selects (== SKILL_RECORDS keys; a
# base-lane test pins them) -- the vault's USES edges read this line as data
skills = [
    "burner_pot", "carry_veg", "faucet_off", "faucet_on", "grasp_pot", "grasp_veg",
    "plan", "pot_veg", "regrasp_veg", "report", "sink_veg", "survey", "v_at_pot",
    "v_pot_held", "v_pot_on_burner", "v_veg_grasped", "v_veg_held", "v_veg_in_pot",
    "v_veg_in_sink", "v_water_off", "v_water_on"
]
initial_facts = "plugins.mission_steam_prep.planner:INITIAL_FACTS"
oracles = "plugins.mission_steam_prep.planner:ORACLES"
predicates = "plugins.mission_steam_prep.planner:PREDICATES"
episodic = true
episode = "plugins.mission_steam_prep.planner:EPISODE"
segment_specs = "plugins.mission_steam_prep.planner:SEGMENT_SPECS"
