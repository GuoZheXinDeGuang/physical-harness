# The recycle_cans PERSISTENT-EPISODE mission card (M7 on RoboCasa). Dropping this
# dir makes {"kind":"task","task":"recycle_cans"} an accepted brief. It declares NO
# [mounts.*], so base_profile's sha is untouched; it composes the base's generic
# persistent-episode runner + node-kind machinery and adds only this mission's
# PURE DATA vocabulary + planner -- the kitchen_thaw pattern, per-can loop shape.
#
# needs_sim: the ONE episode is a real robocasa RecycleSodaCans world (four cans,
# whole-kitchen navigation) the sixteen segment nodes drive and the perceive/
# verify nodes read live. No sibling import (env/percept/predicates/driver all by
# ref via load_provider -- tests/test_boundaries.py); the robocasa card owns the
# third-party surface.
needs_sim = true

[task_bindings.recycle_cans]
# actuation floor for {"kind":"task"} briefs that omit max_actuations: the
# graph's node count plus replan/recovery headroom (the task default of 3 dies at node 3)
max_actuations = 40
env = "plugins.embodiment_robocasa:provider"
percept = "plugins.embodiment_robocasa.percept:provider"
policy = "plugins.embodiment_robocasa.recycle_driver:provider"
planner = "plugins.mission_recycle_cans.planner:provider"
catalogue = "plugins.mission_recycle_cans.planner:CATALOGUE"
records = "plugins.mission_recycle_cans.planner:SKILL_RECORDS"
# the record names this card's planner selects (== SKILL_RECORDS keys; a
# base-lane test pins them) -- the vault's USES edges read this line as data
skills = [
    "carry_can1", "carry_can2", "carry_can3", "carry_can4", "drop_can1", "drop_can2",
    "drop_can3", "drop_can4", "grasp_can1", "grasp_can2", "grasp_can3", "grasp_can4",
    "nav_can1", "nav_can2", "nav_can3", "nav_can4", "plan_order", "report", "survey",
    "sweep", "v_at_can1", "v_at_can2", "v_at_can3", "v_at_can4", "v_grasped_can1",
    "v_grasped_can2", "v_grasped_can3", "v_grasped_can4", "v_placed_can1",
    "v_placed_can2", "v_placed_can3", "v_placed_can4"
]
initial_facts = "plugins.mission_recycle_cans.planner:INITIAL_FACTS"
oracles = "plugins.mission_recycle_cans.planner:ORACLES"
predicates = "plugins.mission_recycle_cans.planner:PREDICATES"
episodic = true
episode = "plugins.mission_recycle_cans.planner:EPISODE"
segment_specs = "plugins.mission_recycle_cans.planner:SEGMENT_SPECS"
