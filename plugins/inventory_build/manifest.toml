# The inventory_build heterogeneous mission card (M6). Dropping this dir makes
# {"kind":"task","task":"inventory_build"} an accepted brief -- discover() folds
# this binding into the union at boot, no base edit. It declares NO [mounts.*],
# so base_profile's sha is untouched (the fold is over mounts only); it composes
# the grasp/pick/stack SKILL_SPECS execution bindings that already exist and adds
# only the perceive/decide/verify PREDICATES its kindful nodes name.
#
# needs_sim: the manipulate nodes actuate the four robosuite tasks and the
# perceive nodes reset the same-seed envs at run time. The doctor's Tier A (load
# the binding's policy/planner, import catalogue/oracles, load_provider EVERY
# predicate ref) runs base-clean; third_party gates any real-sim smoke on a sim
# machine -- symmetric with the clear_build card.
needs_sim = true
third_party = ["robosuite", "mujoco"]

# The new task -> its planner + the by-task composite policy (reused verbatim
# from clear_build: stack -> StackScriptedDriver, every other manipulate node ->
# the four-phase scripted driver, chosen by spec.task -- exactly the four staged
# tasks this mission needs). planner / catalogue / oracles / predicates are this
# card's own heterogeneous vocabulary, reached by ref. `predicates` is the M6
# addition the base already threads (harness_runtime) and checks (plugin_doctor):
# a table mapping each kindful node's skill name -> the "module:factory" ref of
# its machine oracle.
[task_bindings.inventory_build]
policy = "plugins.policies:clear_build_provider"
planner = "plugins.inventory_build.planner:provider"
catalogue = "plugins.inventory_build.planner:CATALOGUE"
oracles = "plugins.inventory_build.planner:ORACLES"
predicates = "plugins.inventory_build.planner:PREDICATES"
