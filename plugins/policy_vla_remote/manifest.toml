# The remote-VLA policy card: `policy.driver` over a websocket policy server
# (StarVLA / openpi pi0.5 official server -- same msgpack+ndarray protocol; the
# VLA stack stays in its own venv behind the socket, this side is
# websockets+msgpack+numpy only: `pip install .[policy_remote]`).
#
# enabled = false -> installed but INACTIVE. It claims policy.driver, which
# plugins/policies already owns, so discover() keeps it out of the folded plan
# while plugin_doctor still checks it at this path. To activate: point a
# session at it (or flip enabled and disable the incumbent) -- one card per
# seam is the duplicate-loud rule (model_qwen precedent).
enabled = false

# needs_sim = false: a transport talks to a policy server, not a simulator.
# Doctor Tier-A shapes it with zero deps installed (lazy client import);
# Tier-B probes the port and SKIPs loudly when no server is listening.
needs_sim = false
third_party = ["websockets", "msgpack"]

[mounts."policy.driver"]
ref = "plugins.policy_vla_remote:provider"
# The TRAINING observation contract, reconciled against the server's
# first-frame handshake metadata at connect: any mismatch on an echoed key
# raises (train/test drift fails loud at mount, never a silently lower success
# rate), and the full handshake record rides the driver into episode evidence.
# `views` has no handshake echo (the server refuses to own camera order) -- it
# is the declared order the driver feeds, reported under
# handshake["unverified"]. TEMPLATE values below: set per checkpoint (these
# match the openpi LIBERO pi0.5 convention) before enabling; host/port default
# to 127.0.0.1:8000 (openpi serve_policy.py's default) in the provider.
#
# There is a fifth, OPT-IN param: `checkpoint_sha` -- the sha256 of the served
# weights (form in plugins/policy_vla_remote/__init__.py:_IDENTITY_KEY). The
# four params above pin the observation contract, which two pi0.5 runs of the
# same task share by construction; only the digest pins WHICH weights answer.
# Declare it and the gate fails closed -- a server that echoes no digest is
# refused, not filed under "unverified". No template value on purpose: a
# placeholder digest is a false identity claim, and a stock openpi server
# echoes {} so it could never match one. Add it when the mount's numbers are
# meant to be attributable to a specific checkpoint.
#
# Three more params are HOW the chunk is executed rather than what was trained
# on, so they sit beside host/port, not in the reconciled contract, and every
# one is OFF unless declared (the default is the drain-the-whole-chunk driver
# every sealed number so far was produced by):
#
#   replan_every = 2      execute 2 actions of each chunk, then re-infer.
#                         Absent = drain all `chunk` of them, 9 of 10 open loop.
#                         Linear in inference calls against the control loop's
#                         deadline -- measure the wall cost before declaring it.
#   ensemble = 0.25       average the overlapping chunks' predictions for the
#                         same timestep, weight exp(-0.25 * age). Needs
#                         replan_every (no overlap, nothing to average -> it
#                         raises rather than mount as a no-op).
#   discrete_dims = [4, 11]   dimensions ensembling must not average, in the
#                         SERVER's action order (for this RoboCasa checkpoint:
#                         control_mode 4, gripper 11). They take the newest
#                         chunk's value; see the driver docstring for why a mean
#                         -- or a majority vote -- is the wrong operation on a
#                         two-valued decision.
params = { image_size = [224, 224], views = ["base_0_rgb", "left_wrist_0_rgb"], chunk = 10, unnorm_key = "libero_spatial_no_noops" }
